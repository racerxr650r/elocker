# CI — the gate every phase must pass (doc/SDP.md §5.3).
#
# `spec` runs first and everything else depends on it: a drifted Project.xml
# invalidates the documents the rest of the suite is verified against, so
# there is no point testing until it is sound.
#
# The runner is Linux. /proc, strace and read-only mounts are Linux facilities;
# the instrumented level skips explicitly elsewhere, and a silent skip is a
# suite failure rather than a pass (doc/STP.md §2.2). Nothing at that level may
# depend on a facility a container withholds — unprivileged user namespaces,
# notably — or the skip-detector below turns an unavailable facility into a
# red build.

name: CI

on:
  push:
    branches: ['phase/**', develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

env:
  # Suppresses noise, not failures: lint_project.py exits non-zero only on
  # errors. Coverage gaps are warnings, tracked by the `coverage` job.
  MAKEFLAGS: --no-print-directory

jobs:
  spec:
    name: spec — Project.xml integrity and document currency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate Project.xml and confirm rendered documents are current
        run: make spec

  coverage:
    name: coverage — verification coverage never regresses
    runs-on: ubuntu-latest
    needs: spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compare gap count against the committed baseline
        run: make coverage

  build:
    name: build — warning-clean with -Werror
    runs-on: ubuntu-latest
    needs: spec
    steps:
      - uses: actions/checkout@v4
      - name: Install libelf and libdw; build every from-source library
        run: |
          # The distribution's libtree-sitter is older than the ABI the
          # pinned grammars generate, and a grammar built against a newer
          # generator than the linked library understands fails at *load*
          # with a version error rather than at build. Building the pinned
          # release is what keeps the two in step (doc/notes.md §1.1).
          #
          # libgit2 comes from source for the reason §1.1 gives and one
          # more: this build compiles the HTTPS and SSH transports out.
          # The distribution package has them in, so an apt install would
          # link network capability into a binary whose whole claim is
          # that it has none — and the instrumented allowlist would still
          # pass, because it checks which libraries are linked and not how
          # they were built.
          #
          # igraph is built with GraphML *and* OpenMP off. GraphML because
          # elc writes it itself and igraph's would link a second XML
          # library; OpenMP because its runtime allocates a thread pool
          # during the dynamic linker's init, and elc is single-threaded by
          # requirement (HLR-041). The distribution package has both on.
          #
          # The list itself is `make prereqs-src`, not an enumeration
          # repeated here. Which libraries are built from source is one
          # fact, and a workflow that restated it drifted from the
          # makefile the moment either gained an entry: Phase 20 lost a
          # morning to libdw missing from this file, and Phase 23 lost
          # one to jansson. Calling the target means there is no second
          # list to keep in step. It also fixes something that had been
          # wrong quietly — Expat was never built here at all, and the
          # runner image's copy was linked instead of the pinned release,
          # which is the arrangement SDP §0 exists to prevent.
          #
          # libelf and libdw are the linked libraries taken from the
          # distribution. elfutils does not build them on its own —
          # configuring the project pulls in bison, flex, gettext and three
          # compression libraries, every one of them a distribution package —
          # so building from source would import more of them than it removes
          # (SDP §0). They are one exception rather than two: same tree, same
          # configure run, same package family, and libdw arrives with the
          # libelf that was already here (Phase 20, HLR-153).
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libelf-dev libdw-dev
          make prereqs-src
      - name: Build
        run: make all CFLAGS="-O2 -g -Werror"
      - name: Confirm the runtime symlink resolves
        run: test -d build/runtime

  unit:
    name: unit — Criterion
    runs-on: ubuntu-latest
