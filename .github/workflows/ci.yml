      - name: Install Graphviz
        run: |
          # The dot/ fixture group settles .dot validity by rendering the
          # emitted file rather than by matching text that looks like DOT
          # (HLR-102). elc neither links Graphviz nor invokes it — an
          # instrumented test holds that — so this is a dependency of the
          # *test*, never of the binary.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends graphviz
