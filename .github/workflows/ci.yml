      - name: Fail if any instrumented test skipped
        run: |
          # A skip here means a requirement went unverified on this runner.
          # On Linux that is a defect, not an accepted degradation.
          if make instrumented 2>&1 | grep -q '# skip'; then
            echo "an instrumented test skipped on a Linux runner" >&2
            make instrumented 2>&1 | grep '# skip' >&2
            exit 1
          fi

