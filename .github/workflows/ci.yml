          # from whichever of the two is present: under `make asan` the binary
          # is already instrumented and ASan judges, and here it is not, so
          # valgrind does. Without the package every one of its memory-safety
          # tests skips, and the step below reads that — correctly — as
          # HLR-124 and HLR-125 going unverified on this runner.
