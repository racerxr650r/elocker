          # configure run, same package family, and libdw arrives with the
          # libelf that was already here (Phase 20, HLR-153).
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libelf-dev libdw-dev
          make prereqs-src
      - name: Install Criterion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcriterion-dev pkg-config
      - name: Run the unit binaries
        run: make unit

  integration:
    name: integration — Bats over build/elc
    runs-on: ubuntu-latest
    needs: spec
    steps:
      - uses: actions/checkout@v4
      - name: Install libelf and libdw; build every from-source library
