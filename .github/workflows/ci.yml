  instrumented:
    name: instrumented — process, link and filesystem observation
    runs-on: ubuntu-latest
    needs: spec
    steps:
      - uses: actions/checkout@v4
      - name: Install libelf and libdw; build every from-source library
        run: |
          # The distribution's libtree-sitter is older than the ABI the
          # pinned grammars generate, and a grammar built against a newer
