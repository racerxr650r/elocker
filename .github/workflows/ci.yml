          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libelf-dev libdw-dev
          make prereqs-src
      - name: Run the integration suites
        run: make integration

  fixtures:
    name: fixtures — hand-counted conformance
    runs-on: ubuntu-latest
    needs: spec
    steps:
      - uses: actions/checkout@v4
      - name: Install libelf and libdw; build every from-source library
        run: |
          # The distribution's libtree-sitter is older than the ABI the
